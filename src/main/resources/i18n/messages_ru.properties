settings.smartproxy.ban_time.tooltip=<html>Как долго (в секундах) прокси остаётся забаненным после сбоя, прежде чем его можно будет выбрать снова.<br>0 = бан навсегда: запись удаляется из рабочего пула при первом сбое.<br>1..9 = учитывается, но рискованно: забаненный прокси может быть выбран снова до того, как поток, забанивший его, завершит повторные попытки, что «перемалывает» пул.<br>Рекомендуемый диапазон: 10..3600.</html>
settings.smartproxy.force.tooltip=<html>ВЫКЛ (по умолчанию) = ПАССИВНЫЙ режим: прокси используются только после того, как MEGA вернёт HTTP 509<br>(дневная квота трафика), или пока открыто окно повторной проверки после 509<br>(см. параметр «Окно повторной проверки» ниже на этой вкладке). До этого — прямые соединения.<br>ВКЛ = ПРИНУДИТЕЛЬНЫЙ режим: каждая часть идёт через прокси независимо от квоты.<br>Полезно для тестирования прокси или когда MEGA уже ограничивает ваш IP.</html>
settings.smartproxy.refresh.tooltip=<html>Как часто MegaBasterd повторно скачивает список прокси из<br>источников #URL (или повторно разбирает встроенный пользовательский список). Это НЕ то же самое,<br>что окно SmartProxy после 509 в диалоге восстановления квоты (меню «Правка»), которое определяет, как долго эта загрузка остаётся на SmartProxy после ошибки 509.</html>
settings.smartproxy.timeout.tooltip=<html>Таймаут TCP+TLS рукопожатия (в секундах) при подключении к прокси.<br>Диапазон 3..120. Меньше 3 с — большинство публичных прокси не успевают завершить рукопожатие,<br>и каждая попытка завершается по таймауту; больше 120 с — поток сжигает таймер отката,<br>ожидая один мёртвый прокси.</html>
