ui.quota.auto_resume_ip.tooltip=<html>Если включено, потоки ChunkDownloader в откате после 509<br>проверяют публичный IP каждые 30 с и немедленно прерывают откат,<br>если IP изменился — например, вы включили VPN.<br>Отключайте только если определение IP в вашей сети работает нестабильно.</html>
ui.quota.batch_size.tooltip=<html>Колько TCP-проверок выполняется параллельно при тестировании прокси.<br>Больше = тест больших списков завершается быстрее, но использует больше сокетов и CPU.<br>Значение по умолчанию 20 безопасно для большинства домашних сетей. Диапазон 1..100.<br>Влияет только на кнопку «Тест»; НЕ меняет параллелизм SmartProxy во время работы.<br>Сохраняется между сеансами.</html>
